[package]
name = "daily-check-widget"
version = "0.1.0"
description = "Daily Check Desktop Floating Widget"
authors = ["Daily Check"]
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
